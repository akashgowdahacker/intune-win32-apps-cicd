name: Catalog validation

on:
  push:
    paths:
      - 'apps/applications.json'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/applications.json'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog and packaging safety
        shell: pwsh
        run: .\scripts\Test-ApplicationCatalog.ps1
